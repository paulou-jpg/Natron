name: Tests

on:
  workflow_dispatch: {}
  push:
    branches:
    - RB-2.5
    - RB-2.6
    paths-ignore:
      - Documentation
  pull_request:
    branches:
    - RB-2.5
    - RB-2.6
    paths-ignore:
      - Documentation

env:
  OCIO_CONFIG_VERSION: 2.5

jobs:
  linux-test:
    name: Test Linux (bootstrap container)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive

      # The build runs inside tools/docker/bootstrap so CI and a developer
      # machine compile in byte-identical environments. Ubuntu 22.04 is pinned
      # in that image because it is the last release carrying the Qt5
      # PySide2/Shiboken2 packages.
      - name: Build bootstrap image
        run: docker build -t natron-boot:ci tools/docker/bootstrap

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-linux-

      - name: Download OpenColorIO-Configs
        run: |
          wget -q https://github.com/NatronGitHub/OpenColorIO-Configs/archive/Natron-v${OCIO_CONFIG_VERSION}.tar.gz
          tar xzf Natron-v${OCIO_CONFIG_VERSION}.tar.gz
          mv OpenColorIO-Configs-Natron-v${OCIO_CONFIG_VERSION} OpenColorIO-Configs

      - name: Download Plugins
        run: |
          mkdir Plugins && cd Plugins
          wget -q https://github.com/NatronGitHub/openfx-io/releases/download/natron_testing/openfx-io-build-ubuntu_22-testing.zip
          unzip -q openfx-io-build-ubuntu_22-testing.zip

      - name: Build and test
        id: build-and-test
        # Allow continuing after error so logs can be uploaded.
        continue-on-error: true
        run: |
          mkdir -p vcpkg-cache build
          docker run --rm \
            -v "$PWD":/src:ro \
            -v "$PWD/build":/build \
            -v "$PWD/vcpkg-cache":/vcpkg-cache \
            -e VCPKG_DEFAULT_BINARY_CACHE=/vcpkg-cache \
            -w /build natron-boot:ci bash -euxc '
              cmake -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
                -DVCPKG_MANIFEST_FEATURES=tests \
                -DVCPKG_INSTALLED_DIR=/build/vcpkg_installed \
                /src
              # Several Gui translation units need well over 1 GB in cc1plus;
              # -j$(nproc) invites the OOM killer on a standard runner.
              ninja -j2
              OFX_PLUGIN_PATH=/src/Plugins \
              OCIO=/src/OpenColorIO-Configs/blender/config.ocio \
                xvfb-run --auto-servernum ctest -V
            '

      - name: Upload Linux test logs
        if: always()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: linux-test-logs
          path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Check for test failures
        if: steps.build-and-test.outcome == 'failure'
        run: exit 1

  win-test:
    name: Test Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CI: 'True'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive

      - name: Install Windows system packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git mingw-w64-x86_64-wget unzip mingw-w64-x86_64-ninja mingw-w64-x86_64-cmake

      - name: Install Natron pacman repository
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/install_natron_pacman_repo.sh ${GITHUB_WORKSPACE} ${GITHUB_WORKSPACE}/natron_pacman_repo
          pacman -S --needed --noconfirm --overwrite "*" mingw-w64-x86_64-natron-build-deps-qt5
          # Formerly vendored in libs/; on Windows these come from MSYS2 rather
          # than vcpkg, which does not target the mingw64 toolchain cleanly.
          pacman -S --needed --noconfirm --overwrite "*" \
            mingw-w64-x86_64-eigen3 mingw-w64-x86_64-glog mingw-w64-x86_64-gtest

      - name: Download OpenColorIO-Configs
        run: |
          wget -q https://github.com/NatronGitHub/OpenColorIO-Configs/archive/Natron-v${OCIO_CONFIG_VERSION}.tar.gz
          tar xzf Natron-v${OCIO_CONFIG_VERSION}.tar.gz
          mv OpenColorIO-Configs-Natron-v${OCIO_CONFIG_VERSION} OpenColorIO-Configs

      - name: Build Windows
        run: |
          mkdir build && cd build
          cmake -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo ../
          ninja

      - name: Run Windows Tests
        id: run-windows-tests
        # Allow continuing after error so logs can be uploaded.
        continue-on-error: true
        run: |
          cd build
          mkdir Plugins && cd Plugins
          wget -q https://github.com/NatronGitHub/openfx-io/releases/download/natron_testing/openfx-io-build-windows_latest-testing.zip
          unzip -q openfx-io-build-windows_latest-testing.zip
          cd ..
          PYTHONHOME=/mingw64 OFX_PLUGIN_PATH=$PWD/Plugins OCIO=$PWD/../OpenColorIO-Configs/blender/config.ocio ctest -V

      - name: Upload Windows test logs
        if: always()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: windows-test-logs
          path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

      - name: Check for test failures
        if: steps.run-windows-tests.outcome == 'failure'
        run: exit 1
